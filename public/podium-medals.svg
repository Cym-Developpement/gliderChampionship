      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(45)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(67.5)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(90)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(112.5)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(135)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(157.5)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(180)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(202.5)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(225)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(247.5)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(270)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(292.5)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(315)"/>
      <rect x="-4" y="-70" width="8" height="28" rx="4" fill="#E8B400" transform="rotate(337.5)"/>
    </g>
    <!-- Outer ring -->
    <circle r="64" fill="url(#goldGrad)" stroke="#C9960C" stroke-width="2.5"/>
    <!-- Laurel ring -->
    <circle r="56" fill="none" stroke="#E8B400" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- Portrait circle -->
    <circle r="48" fill="url(#portraitBg)" stroke="#F0D060" stroke-width="3"/>
    <!-- Silhouette -->
    <ellipse cx="0" cy="18" rx="20" ry="26" fill="#8A9BAA"/>
    <circle cx="0" cy="-10" r="16" fill="#8A9BAA"/>
    <!-- Stars bottom -->
    <text x="0" y="70" text-anchor="middle" font-size="14" fill="#F5C200">★ ★ ★</text>
  </g>
  <!-- Gold ribbon -->
  <g transform="translate(260,182)">
    <path d="M-72,0 Q-66,-15 0,-15 Q66,-15 72,0 Q66,17 0,17 Q-66,17 -72,0Z" fill="#5B9BD5"/>
    <path d="M-72,0 L-92,12 L-76,0 L-92,-12 Z" fill="#4080B8"/>
