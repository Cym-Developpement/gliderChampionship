    <path d="M-60,0 Q-55,-12 0,-12 Q55,-12 60,0 Q55,14 0,14 Q-55,14 -60,0Z" fill="#5B9BD5"/>
    <path d="M-60,0 L-76,10 L-64,0 L-76,-10 Z" fill="#4080B8"/>
