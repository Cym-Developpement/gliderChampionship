    <g opacity="0.7">
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(0)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(30)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(60)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(90)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(120)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(150)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(180)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(210)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(240)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(270)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(300)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#9BA8B0" transform="rotate(330)"/>
    </g>
    <!-- Outer ring -->
    <circle r="52" fill="url(#silverGrad)" stroke="#A0A8B0" stroke-width="2"/>
    <!-- Portrait circle -->
    <circle r="40" fill="url(#portraitBg)" stroke="#C8D0D8" stroke-width="3"/>
    <!-- Silhouette -->
    <ellipse cx="0" cy="14" rx="17" ry="22" fill="#8A9BAA"/>
    <circle cx="0" cy="-10" r="13" fill="#8A9BAA"/>
    <!-- Crossed swords decoration -->
    <line x1="-50" y1="-15" x2="-28" y2="5" stroke="#B0B8C0" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="-15" x2="-50" y2="5" stroke="#B0B8C0" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="-15" x2="50" y2="5" stroke="#B0B8C0" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-15" x2="28" y2="5" stroke="#B0B8C0" stroke-width="3" stroke-linecap="round"/>
