      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(30)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(60)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(90)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(120)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(150)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(180)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(210)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(240)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(270)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(300)"/>
      <rect x="-3" y="-58" width="6" height="22" rx="3" fill="#A0724A" transform="rotate(330)"/>
    </g>
