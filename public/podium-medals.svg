    <circle r="40" fill="url(#portraitBg)" stroke="#E0A060" stroke-width="3"/>
    <!-- Silhouette -->
    <ellipse cx="0" cy="14" rx="17" ry="22" fill="#8A9BAA"/>
    <circle cx="0" cy="-10" r="13" fill="#8A9BAA"/>
    <!-- Crossed decoration -->
    <line x1="-50" y1="-15" x2="-28" y2="5" stroke="#A07848" stroke-width="3" stroke-linecap="round"/>
    <line x1="-28" y1="-15" x2="-50" y2="5" stroke="#A07848" stroke-width="3" stroke-linecap="round"/>
    <line x1="28" y1="-15" x2="50" y2="5" stroke="#A07848" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="-15" x2="28" y2="5" stroke="#A07848" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Bronze ribbon -->
  <g transform="translate(415,170)">
    <path d="M-60,0 Q-55,-12 0,-12 Q55,-12 60,0 Q55,14 0,14 Q-55,14 -60,0Z" fill="#5B9BD5"/>
    <path d="M-60,0 L-76,10 L-64,0 L-76,-10 Z" fill="#4080B8"/>
    <path d="M60,0 L76,10 L64,0 L76,-10 Z" fill="#4080B8"/>
