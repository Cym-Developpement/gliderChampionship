<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="520" height="260">
  <defs>
    <!-- Gold gradient -->
    <radialGradient id="goldGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="60%" stop-color="#F5C200"/>
      <stop offset="100%" stop-color="#C9960C"/>
    </radialGradient>
    <!-- Silver gradient -->
    <radialGradient id="silverGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="60%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#888"/>
    </radialGradient>
    <!-- Bronze gradient -->
    <radialGradient id="bronzeGrad" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8A96A"/>
      <stop offset="60%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8B5010"/>
    </radialGradient>
    <!-- Portrait bg -->
    <radialGradient id="portraitBg" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#D0D8E0"/>
      <stop offset="100%" stop-color="#B0B8C4"/>
    </radialGradient>
    <!-- Clip circles -->
    <clipPath id="clipGold"><circle cx="260" cy="108" r="48"/></clipPath>
    <clipPath id="clipSilver"><circle cx="105" cy="118" r="40"/></clipPath>
    <clipPath id="clipBronze"><circle cx="415" cy="118" r="40"/></clipPath>
  </defs>

  <!-- ===== SILVER MEDAL (left, 2nd) ===== -->
  <g transform="translate(105,118)">
